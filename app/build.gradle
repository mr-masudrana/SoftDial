plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.softdial'
    compileSdk 34
    buildFeatures { buildConfig = true }

    defaultConfig {
        applicationId "com.example.softdial"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "6.0"
    }
    // Release signing is enabled only when GitHub Actions provides all signing values.
    def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
    def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

    if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging { jniLibs { useLegacyPackaging = true } }
}

// Firebase push is enabled only if app/google-services.json exists
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.linphone:linphone-sdk-android:5.3.0'
}
