name: SoftDial Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Add google-services.json (optional, for FCM push)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then printf '%s' "$GS_JSON" > app/google-services.json; fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        run: gradle --no-daemon assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: softdial-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
